name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Action v7+ is required for golangci-lint v2; v1.64.8 cannot lint Go 1.25.
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags "-s -w -X github.com/cozyGarage/bbscope/v2/cmd.Version=${VERSION} -X github.com/cozyGarage/bbscope/v2/cmd.Commit=${COMMIT} -X github.com/cozyGarage/bbscope/v2/cmd.BuildDate=${DATE}" -o bbscope-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbscope-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bbscope-${{ matrix.goos }}-${{ matrix.goarch }}*

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The pinned securego/gosec Docker image bundles Go 1.23 with
      # GOTOOLCHAIN=local, which cannot load this module (go.mod requires 1.25).
      # Run gosec under the workflow's Go 1.25 toolchain instead.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install gosec
        # Pin to a release that builds under Go 1.25 (v2.21.4 fails to compile
        # against modern x/tools).
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run Gosec Security Scanner
        # Excluded rules are intentional design choices / false positives for
        # this recon tool (see .golangci.yml gosec.excludes for rationale).
        run: gosec -exclude=G104,G101,G115,G201,G204,G304,G402,G505,G701 -exclude-dir=docs ./...

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result." && exit 1)

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    # Advisory: govulncheck also reports standard-library CVEs fixed only in the
    # very latest Go patch releases, which are outside this repo's control and
    # would otherwise block unrelated PRs. Keep it visible but non-blocking; act
    # on actionable module-level findings by upgrading the dependency.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  release-check:
    name: Release Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Validate GoReleaser configuration
        run: goreleaser check
