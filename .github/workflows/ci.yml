name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The pkg/storage integration tests are gated on TEST_DB_URL and skip when it
    # is unset. Without this service they never ran in CI, so the package that
    # owns every destructive database operation reported ~6% coverage while
    # appearing tested.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbscope
          POSTGRES_PASSWORD: bbscope
          POSTGRES_DB: bbscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbscope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_URL: postgres://bbscope:bbscope@127.0.0.1:5432/bbscope?sslmode=disable
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::coverage.out was not produced"
            exit 1
          fi
          go tool cover -func=coverage.out | tail -n 5

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Action v7+ is required for golangci-lint v2; v1.64.8 cannot lint Go 1.26.
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint]
    env:
      GOFLAGS: -mod=readonly
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags "-s -w -X github.com/cozyGarage/bbscope/v2/cmd.Version=${VERSION} -X github.com/cozyGarage/bbscope/v2/cmd.Commit=${COMMIT} -X github.com/cozyGarage/bbscope/v2/cmd.BuildDate=${DATE}" -o bbscope-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bbscope-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bbscope-${{ matrix.goos }}-${{ matrix.goarch }}*

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The pinned securego/gosec Docker image bundles Go 1.23 with
      # GOTOOLCHAIN=local, which cannot load this module (go.mod requires 1.26).
      # Run gosec under the workflow's Go 1.26 toolchain instead.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install gosec
        # Pin to a release that builds under Go 1.26 (v2.21.4 fails to compile
        # against modern x/tools).
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run Gosec Security Scanner
        # Excluded rules are intentional design choices / false positives for
        # this recon tool (see .golangci.yml gosec.excludes for rationale).
        run: gosec -exclude=G104,G101,G115,G201,G204,G304,G402,G505,G701 -exclude-dir=docs ./...

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result." && exit 1)

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: govulncheck also reports standard-library CVEs fixed only in the
    # very latest Go patch releases, which are outside this repo's control and
    # would otherwise block unrelated PRs. Keep it visible but non-blocking; act
    # on actionable module-level findings by upgrading the dependency.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck -mode=source ./...

  release-check:
    name: Release Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"

      - name: Validate GoReleaser configuration
        run: goreleaser check

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Official action requires a commercial license for private orgs; the
      # CLI image is MIT and scans the working tree (not git history).
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            zricethezav/gitleaks:v8.24.0 \
            detect --source=/src --no-git --redact --config=/src/.gitleaks.toml --verbose

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Fuzz parsers
        # -run=^$ skips regular tests. `go test -fuzz=... ./pkg/storage/` would
        # otherwise run TestIntegrationDatabaseIsConfiguredInCI, which fails
        # when TEST_DB_URL is unset (GitHub sets CI=true on every job).
        run: |
          go test -run=^$ -fuzz=FuzzNormalizeTarget -fuzztime=15s ./pkg/storage/
          go test -run=^$ -fuzz=FuzzCanonicalName -fuzztime=15s ./pkg/platforms/
          go test -run=^$ -fuzz=FuzzWebhookURLAllowed -fuzztime=15s ./pkg/notify/
