name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      id: repo
      run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    # Always load locally so Trivy can scan. Push is a separate step: buildx
    # cannot load and push with the same exporter on every runner.
    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        push: false
        tags: |
          ghcr.io/${{ steps.repo.outputs.name }}:latest
          ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true

    - name: Scan image
      # Pin by SHA: tags like 0.28.0 are not published (need v0.36.0).
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL
      # Advisory: fail the step on a *fixable* CRITICAL, but do not block
      # publish/PRs on base-image lag or scanner flakes.
      continue-on-error: true

    - name: Push image
      if: github.event_name != 'pull_request'
      run: |
        docker push "ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}"
        docker push "ghcr.io/${{ steps.repo.outputs.name }}:latest"
