# golangci-lint configuration for bbscope
# See https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional security linters
    - gosec
    - bodyclose
    # Code quality
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    # Error handling
    - errorlint
    # Performance
    - prealloc
  disable:
    - exhaustive
    - exhaustruct

linters-settings:
  gosec:
    excludes:
      - G104 # Audit errors not checked (we handle this case by case)
      # The following are intentional design choices / false positives for this
      # recon tool and are handled deliberately in the code:
      - G101 # "credential" constants are keychain key names, not secrets
      - G115 # integer conversion is bounded (TOTP time step)
      - G201 # SQL is built from hardcoded strings with parameterised values
      - G204 # `db shell` intentionally launches psql
      - G304 # `db import` intentionally opens a user-provided file
      - G402 # TLS verification is intentionally skippable for proxy debugging
      - G505 # SHA1 is required by the TOTP spec (RFC 4226)
    config:
      global:
        audit: enabled
  
  govet:
    enable-all: true
    disable:
      - fieldalignment # Not critical for this project
      - shadow # Flags idiomatic err shadowing; too noisy for this project
      - unusedwrite # Flags struct fields set in tests but not asserted
  
  goimports:
    local-prefixes: github.com/cozyGarage/bbscope
  
  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - prealloc
    
    # Exclude known issues in generated code
    - path: docs/
      linters:
        - all
    
    # Allow fmt.Print in cmd package (CLI output)
    - path: cmd/
      text: "fmt.Print"
      linters:
        - forbidigo

  # Maximum issues count per one linter
  max-issues-per-linter: 50
  
  # Maximum count of issues with the same text
  max-same-issues: 3

severity:
  default-severity: warning
  rules:
    - linters:
        - gosec
      severity: error
