version: "2"

run:
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - prealloc
    - unconvert
    - unparam
  disable:
    - exhaustive
    - exhaustruct
  settings:
    gosec:
      excludes:
        - G104 # Audit errors not checked (handled case by case)
        - G101 # "credential" constants are keychain key names, not secrets
        - G115
        - G201
        - G204
        - G304
        - G402
        - G505
        # CREATE DATABASE uses validateDatabaseName + pgx.Identifier.Sanitize.
        - G701
      config:
        global:
          audit: enabled
    govet:
      disable:
        - fieldalignment
        - shadow
        - unusedwrite
      enable-all: true
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        # Style nits that would create noisy churn unrelated to Go 1.25 migration.
        - "-QF1003"
        - "-ST1005"
        # Historical exported/API names (Url, USER_AGENT, etc.) — rename is out of scope.
        - "-ST1003"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
          - prealloc
          - unparam
        path: _test\.go
      - linters:
          - all
        path: docs/
      - linters:
          - forbidigo
        path: cmd/
        text: fmt.Print
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

severity:
  default: error

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cozyGarage/bbscope
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
